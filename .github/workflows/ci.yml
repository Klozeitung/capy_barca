name: CI

# Regression gate for pushes and pull requests. The backend suite is defined in
# backend/test_suite.txt and shared with setup.sh, so the installer and CI can
# never cover a different set of files.

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # The suite runs against PostgreSQL, the database production uses. The
    # image matches the db service in docker-compose.yml. The database name
    # ends in '_test' because the suite refuses any other (see conftest.py).
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: capybarca
          POSTGRES_PASSWORD: capybarca
          POSTGRES_DB: capybarca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capybarca -d capybarca_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://capybarca:capybarca@localhost:5432/capybarca_test
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the python:3.12-slim base image of backend/Dockerfile.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          mapfile -t TESTS < <(sed -e 's/#.*//' -e 's/[[:space:]]//g' test_suite.txt | grep -v '^$')
          if [ ${#TESTS[@]} -eq 0 ]; then
            echo "test_suite.txt lists no test files."
            exit 1
          fi
          echo "Suite: ${#TESTS[@]} test files"
          pytest "${TESTS[@]}" -q

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the node:22-alpine base image of frontend/Dockerfile.
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run vitest
        run: npm run test

      - name: Build
        # 'build' runs vue-tsc first, so this also acts as the type check.
        run: npm run build
