services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${PORT_DB:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capybarca} -d ${POSTGRES_DB:-capybarca_db}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      TAILSCALE_IP: "${TAILSCALE_IP}"
      TAILSCALE_HOSTNAME: "${TAILSCALE_HOSTNAME}"
      PORT_FRONTEND: "${PORT_FRONTEND:-1701}"
    volumes:
      - ./ssl:/app/ssl:ro
      - ./static/uploads:/app/static/uploads
      - ./recovery/backup:/app/recovery/backup:ro
    expose:
      - "${PORT_BACKEND:-17012}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      PORT_BACKEND: "${PORT_BACKEND:-17012}"
      PORT_FRONTEND: "${PORT_FRONTEND:-1701}"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "${PORT_FRONTEND:-1701}:${PORT_FRONTEND:-1701}"
    depends_on:
      - backend
      - collabora

  collabora:
    image: collabora/code:latest
    restart: unless-stopped
    environment:
      # SSL wird von nginx terminiert; Collabora laeuft intern auf HTTP.
      # extra_params ist die korrekte Weise, coolwsd-Optionen im Docker-Image
      # zu setzen – die --o: Syntax schreibt direkt in coolwsd.xml.
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
      # Requests von beliebigen Origins zulassen (self-hosted hinter nginx).
      - aliasgroup1=https?://.*
    expose:
      - "9980"
    cap_add:
      - MKNOD

volumes:
  postgres_data:
