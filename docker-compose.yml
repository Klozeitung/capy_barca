services:
  db:
    image: postgres:16.14
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback only. The backend reaches PostgreSQL over the Compose network
      # via the service name 'db', so this mapping exists purely for host-local
      # maintenance (psql, pg_dump). Publishing on all interfaces would expose
      # the database to the LAN and to the tailnet.
      - "127.0.0.1:${PORT_DB:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capybarca} -d ${POSTGRES_DB:-capybarca_db}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      TAILSCALE_IP: "${TAILSCALE_IP}"
      TAILSCALE_HOSTNAME: "${TAILSCALE_HOSTNAME}"
      PORT_FRONTEND: "${PORT_FRONTEND:-1701}"
    volumes:
      - ./ssl:/app/ssl:ro
      - ./static/uploads:/app/static/uploads
      - ./recovery/backup:/app/recovery/backup:ro
    expose:
      - "${PORT_BACKEND:-17012}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      PORT_BACKEND: "${PORT_BACKEND:-17012}"
      PORT_FRONTEND: "${PORT_FRONTEND:-1701}"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "${PORT_FRONTEND:-1701}:${PORT_FRONTEND:-1701}"
    depends_on:
      - backend
      - collabora

  collabora:
    # Pinned deliberately. The 'latest' tag can cross a major release and
    # change WOPI behaviour without any change in this repository; new
    # versions are adopted here and rolled out via update.sh.
    image: collabora/code:26.04.2.4.1
    restart: unless-stopped
    environment:
      # SSL is terminated by nginx; Collabora runs on plain HTTP internally.
      # extra_params is the supported way to pass coolwsd options to the Docker
      # image - the --o: syntax writes directly into coolwsd.xml.
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
      # Accept requests from any origin (self-hosted behind nginx).
      - aliasgroup1=https?://.*
    expose:
      - "9980"
    cap_add:
      - MKNOD

volumes:
  postgres_data:
