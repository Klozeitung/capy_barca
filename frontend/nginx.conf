server {
    listen ${PORT_FRONTEND} ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA-Fallback: alle Routen auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health-Check: /api/health → /health am Backend
    location = /api/health {
        proxy_pass          https://backend:${PORT_BACKEND}/health;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_ssl_verify    off;
    }

    # API-Proxy zum Backend
    location /api/ {
        # Kein Upload-Limit – Kapazitätskontrolle erfolgt serverseitig
        client_max_body_size 0;

        proxy_pass          https://backend:${PORT_BACKEND};
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_ssl_verify    off;

        # Grosse Uploads brauchen mehr Zeit
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # WebSocket-Proxy zum Backend
    location /ws {
        proxy_pass          https://backend:${PORT_BACKEND};
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_ssl_verify    off;
    }

    # Statische Uploads vom Backend
    location /static/ {
        proxy_pass       https://backend:${PORT_BACKEND};
        proxy_ssl_verify off;
    }

    # ── Collabora Online ──────────────────────────────────────────────────────
    # Collabora laeuft intern auf HTTP (kein SSL), nginx uebernimmt die
    # SSL-Terminierung. Konfiguration folgt den offiziellen Collabora-Proxy-
    # Empfehlungen (https://sdk.collaboraonline.com/docs/installation/Proxy_settings.html).
    #
    # WICHTIG: $http_host (mit Port) statt $host (ohne Port) – Collabora
    # validiert den Origin-Header und benoetigt den vollstaendigen Host-Wert.

    # Einstiegspunkt (cool.html)
    location /collabora/ {
        proxy_pass          http://collabora:9980/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_read_timeout  36000s;
        proxy_send_timeout  36000s;
        client_max_body_size 0;
    }

    # Statische Assets (absoluter Pfad aus cool.html)
    location ^~ /browser {
        proxy_pass          http://collabora:9980;
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
    }

    # Collabora Admin-WebSocket (vor dem allgemeinen /cool/-Match)
    location ^~ /cool/adminws {
        proxy_pass          http://collabora:9980;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "Upgrade";
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_read_timeout  36000s;
        proxy_send_timeout  36000s;
    }

    # Collabora Dokument-WebSocket (Regex-Match lt. offizieller Doku)
    location ~ ^/cool/(.*)/ws$ {
        proxy_pass          http://collabora:9980;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "Upgrade";
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_read_timeout  36000s;
        proxy_send_timeout  36000s;
    }

    # Collabora sonstige /cool/- und /lool/-Pfade (Download, Upload, WOPI)
    location ~ ^/(c|l)ool {
        proxy_pass          http://collabora:9980;
        proxy_http_version  1.1;
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_read_timeout  36000s;
        proxy_send_timeout  36000s;
        client_max_body_size 0;
    }

    # WOPI Discovery und Capabilities
    location ^~ /hosting {
        proxy_pass          http://collabora:9980;
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Forwarded-Proto https;
    }
}
