# ── Forwarded-header policy ───────────────────────────────────────────────────
# Every location that proxies to the backend sets X-Forwarded-For to
# $remote_addr, overwriting whatever the client sent, rather than appending to
# it with $proxy_add_x_forwarded_for.
#
# The backend runs uvicorn with --proxy-headers and trusts its peers, and in
# that mode uvicorn reads the leftmost entry of the header. With an appending
# configuration that entry is the client's own value, so any caller could
# choose the address the backend sees and defeat the per-client rate limit.
# Overwriting guarantees the header carries exactly one value that nginx
# produced itself.
#
# Consequence: a genuine upstream proxy in front of nginx would be masked, and
# its address rather than the end client's would reach the backend. CapyBarca
# is served directly over Tailscale, so no such proxy exists.
#
# Locations that do not set the header at all are equally affected, because
# nginx forwards unknown client headers to the upstream untouched. Every
# backend location therefore sets it explicitly.

server {
    listen ${PORT_FRONTEND} ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA fallback: all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check: /api/health -> /health on the backend
    location = /api/health {
        proxy_pass          https://backend:${PORT_BACKEND}/health;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_ssl_verify    off;
    }

    # API proxy to the backend
    location /api/ {
        # No upload limit - capacity is controlled server-side
        client_max_body_size 0;

        proxy_pass          https://backend:${PORT_BACKEND};
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_ssl_verify    off;

        # Large uploads need more time
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # WebSocket proxy to the backend
    location /ws {
        proxy_pass          https://backend:${PORT_BACKEND};
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_ssl_verify    off;
    }

    # Static uploads from the backend
    location /static/ {
        proxy_pass          https://backend:${PORT_BACKEND};
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_ssl_verify    off;
    }

    # ── Collabora Online ──────────────────────────────────────────────────────
    # Collabora runs on plain HTTP internally; nginx terminates SSL. The
    # configuration follows the official Collabora proxy recommendations
    # (https://sdk.collaboraonline.com/docs/installation/Proxy_settings.html).
    #
    # IMPORTANT: $http_host (with port) instead of $host (without port) -
    # Collabora validates the Origin header and needs the full host value.

    # Entry point (cool.html)
    location /collabora/ {
        proxy_pass          http://collabora:9980/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_read_timeout  36000s;
        proxy_send_timeout  36000s;
        client_max_body_size 0;
    }

    # Static assets (absolute path from cool.html)
    location ^~ /browser {
        proxy_pass          http://collabora:9980;
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto https;
    }

    # Collabora admin WebSocket (before the general /cool/ match)
    location ^~ /cool/adminws {
        proxy_pass          http://collabora:9980;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "Upgrade";
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_read_timeout  36000s;
        proxy_send_timeout  36000s;
    }

    # Collabora document WebSocket (regex match per the official docs)
    location ~ ^/cool/(.*)/ws$ {
        proxy_pass          http://collabora:9980;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "Upgrade";
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_read_timeout  36000s;
        proxy_send_timeout  36000s;
    }

    # Other Collabora /cool/ and /lool/ paths (download, upload, WOPI)
    location ~ ^/(c|l)ool {
        proxy_pass          http://collabora:9980;
        proxy_http_version  1.1;
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_read_timeout  36000s;
        proxy_send_timeout  36000s;
        client_max_body_size 0;
    }

    # WOPI discovery and capabilities
    location ^~ /hosting {
        proxy_pass          http://collabora:9980;
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto https;
    }
}
