# Security headers for the application's own responses.
#
# Included by every location that serves the application or its API. nginx
# drops all inherited add_header directives in a location that declares one of
# its own, so the headers live in this file and each location includes it
# rather than relying on server-level inheritance.
#
# The Collabora locations do not include it. Collabora sends its own
# Content-Security-Policy and framing headers, and a second policy from here
# would apply on top of them and break the editor.
#
# Strict-Transport-Security: the certificate comes from 'tailscale cert' and is
# trusted by browsers, so HTTPS is the only way the application is reached. No
# includeSubDomains, since the tailnet name is shared with other machines.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
# Framing protection for browsers that predate frame-ancestors. Current
# browsers follow frame-ancestors in the policy below and ignore this header
# when both are present; the two agree, so either way only same-origin pages
# may frame the application.
add_header X-Frame-Options           "SAMEORIGIN" always;

# Content-Security-Policy, enforced: the browser blocks anything outside these
# sources and reports the violation in the console.
#
#   script-src  'self'         the bundle only; Vite emits no inline scripts
#   style-src   'unsafe-inline' Vue and the date picker set inline styles
#   img-src     https:         bookmark previews and favicons of other sites;
#                              the bookmark block only renders https images
#   frame-src   https:         the embed block shows arbitrary https pages
#   worker-src  blob:          the Excel export compresses large sheets in a
#                              worker it builds from a blob URL; only the
#                              bundle itself can create such URLs
#   connect-src 'self'         API and WebSocket; icons are bundled
#                              (src/plugins/icons.ts)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
